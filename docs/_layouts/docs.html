---
layout: default
---

<div class="docs-shell">

  <button type="button" id="docs-sidebar-toggle" class="docs-sidebar-toggle" aria-expanded="false"
    aria-controls="docs-sidebar" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>

  <div class="docs-sidebar-backdrop" id="docs-sidebar-backdrop"></div>

  <aside class="docs-sidebar" id="docs-sidebar">
    <div class="docs-sidebar-inner">

      <a class="docs-brand" href="{{ '/' | relative_url }}">
        <strong>{{ site.title }}</strong>
        <span>{{ site.tagline | default: "Documentation" }}</span>
      </a>

      <div class="docs-search">
        <input type="search" id="docs-search-input" placeholder="Search docs…" aria-label="Search documentation">
        <p id="docs-search-empty" class="docs-search-empty" hidden>No matching pages.</p>
      </div>

      <nav class="docs-nav" id="docs-nav" aria-label="Documentation navigation">
        {% for group in site.data.nav %}
        <div class="docs-nav-group">
          <p class="docs-nav-group-title">{{ group.title }}</p>
          <ul>
            {% for item in group.items %}
            <li>
              <a href="{{ item.url | relative_url }}" {% if page.url==item.url %} class="active" aria-current="page" {%
                endif %}>{{ item.title }}</a>
            </li>
            {% endfor %}
          </ul>
        </div>
        {% endfor %}
      </nav>

      <div class="docs-sidebar-footer">
        <button type="button" id="docs-theme-toggle" class="docs-theme-toggle" aria-label="Toggle light/dark theme">
          <span class="docs-theme-icon" aria-hidden="true">🌓</span> Toggle theme
        </button>
        <a class="docs-github-link" href="https://github.com/{{ site.repository | default: 'unq0de/statement-ai' }}"
          target="_blank" rel="noopener">
          View on GitHub ↗
        </a>
      </div>

    </div>
  </aside>

  <main class="docs-main">
    <article class="docs-content" id="docs-content">
      {{ content }}
    </article>

    <aside class="docs-toc" id="docs-toc" aria-label="On this page">
      <p class="docs-toc-title">On this page</p>
      <ul id="docs-toc-list"></ul>
    </aside>
  </main>

</div>

<script src="{{ '/assets/js/docs.js' | relative_url }}" defer></script>
