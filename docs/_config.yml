# ----------------------------------------------------------------------------
# Site settings
# ----------------------------------------------------------------------------
title: Statement AI
description: >-
  Documentation for Statement AI — the AI-powered REST API that reads bank
  statement PDFs, categorizes every transaction, and generates financial
  summaries.
tagline: Documentation

# TODO: replace with your own GitHub username/org.
url: "https://unq0de.github.io"
# NOTE: leave baseurl empty here. The GitHub Actions workflow
# (.github/workflows/pages.yml) injects the correct project-pages base path
# automatically at build time, and an empty baseurl is what you want for
# `bundle exec jekyll serve` while developing locally.
baseurl: ""

repository: unq0de/statement_ai
github_username: unq0de

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
theme: minima
minima:
  skin: classic
  # We ship our own sidebar navigation, so the default Minima header
  # link list stays empty on purpose.
  header_pages: []
  social_links: []

# ----------------------------------------------------------------------------
# Markdown / syntax highlighting
# ----------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  hard_wrap: false

# ----------------------------------------------------------------------------
# Plugins (all part of the GitHub Pages allow-list)
# ----------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ----------------------------------------------------------------------------
# Every page in this site is a documentation page with the sidebar layout,
# so we set it as the default instead of repeating it in every file.
# ----------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
    values:
      layout: docs

# ----------------------------------------------------------------------------
# Build excludes
# ----------------------------------------------------------------------------
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md

permalink: pretty
