services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8001:8001"
    environment: &app_environment
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_USAGE_TRACKING_ENABLED=${API_USAGE_TRACKING_ENABLED:-1}
      - API_USAGE_RETENTION_DAYS=${API_USAGE_RETENTION_DAYS:-90}
      - AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS:-365}
      - GEMINI_MONTHLY_LIMIT_PER_USER=${GEMINI_MONTHLY_LIMIT_PER_USER:-0}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-12}
      - PASSWORD_CHECK_USER_ATTRIBUTES=${PASSWORD_CHECK_USER_ATTRIBUTES:-1}
      - PASSWORD_CHECK_COMMON=${PASSWORD_CHECK_COMMON:-1}
      - PASSWORD_CHECK_NUMERIC=${PASSWORD_CHECK_NUMERIC:-1}
      - PASSWORD_CHECK_SPECIAL_CHARACTERS=${PASSWORD_CHECK_SPECIAL_CHARACTERS:-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - NUM_PROXIES=${NUM_PROXIES:-0}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-}
      - EMAIL_TIMEOUT=${EMAIL_TIMEOUT:-10}
      - EMAIL_USE_HTML_TEMPLATES=${EMAIL_USE_HTML_TEMPLATES:-0}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - PASSWORD_RESET_TIMEOUT=${PASSWORD_RESET_TIMEOUT:-3600}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-}
      - REGISTRATION_CONFIRMATION_URL=${REGISTRATION_CONFIRMATION_URL:-}
      - TWO_FACTOR_ENABLED=${TWO_FACTOR_ENABLED:-1}
      - TWO_FACTOR_ISSUER=${TWO_FACTOR_ISSUER:-Statement AI}
      - TWO_FACTOR_ENCRYPTION_KEY=${TWO_FACTOR_ENCRYPTION_KEY:-}
      - TWO_FACTOR_CHALLENGE_TIMEOUT_SECONDS=${TWO_FACTOR_CHALLENGE_TIMEOUT_SECONDS:-300}
      - TWO_FACTOR_MAX_CHALLENGE_ATTEMPTS=${TWO_FACTOR_MAX_CHALLENGE_ATTEMPTS:-5}
      - TWO_FACTOR_RECOVERY_CODE_COUNT=${TWO_FACTOR_RECOVERY_CODE_COUNT:-10}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-365}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # DB_ENGINE=local (default) uses the "db" container below.
      # DB_ENGINE=supabase uses a hosted Supabase Postgres instance instead.
      - DB_ENGINE=${DB_ENGINE:-local}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-statement_ai_db}
      - POSTGRES_USER=${POSTGRES_USER:-statement_ai_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-statement_ai_password}
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST:-}
      - SUPABASE_DB_PORT=${SUPABASE_DB_PORT:-5432}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME:-postgres}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-}
      - SUPABASE_DB_SSLMODE=${SUPABASE_DB_SSLMODE:-require}
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    command: python manage.py migrate --noinput
    volumes:
      - .:/app
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
        required: false

  worker:
    build: .
    command: celery -A statement_ai worker --loglevel=INFO --concurrency=2
    user: nobody
    volumes:
      - .:/app
      - media_data:/app/media
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cron:
    build: .
    command: [ "sh", "/app/cron/entrypoint.sh" ]
    volumes:
      - .:/app
      - media_data:/app/media
    environment:
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_USAGE_TRACKING_ENABLED=${API_USAGE_TRACKING_ENABLED:-1}
      - API_USAGE_RETENTION_DAYS=${API_USAGE_RETENTION_DAYS:-90}
      - AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS:-365}
      - GEMINI_MONTHLY_LIMIT_PER_USER=${GEMINI_MONTHLY_LIMIT_PER_USER:-0}
      - PASSWORD_MIN_LENGTH=${PASSWORD_MIN_LENGTH:-12}
      - PASSWORD_CHECK_USER_ATTRIBUTES=${PASSWORD_CHECK_USER_ATTRIBUTES:-1}
      - PASSWORD_CHECK_COMMON=${PASSWORD_CHECK_COMMON:-1}
      - PASSWORD_CHECK_NUMERIC=${PASSWORD_CHECK_NUMERIC:-1}
      - PASSWORD_CHECK_SPECIAL_CHARACTERS=${PASSWORD_CHECK_SPECIAL_CHARACTERS:-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - NUM_PROXIES=${NUM_PROXIES:-0}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-}
      - EMAIL_TIMEOUT=${EMAIL_TIMEOUT:-10}
      - EMAIL_USE_HTML_TEMPLATES=${EMAIL_USE_HTML_TEMPLATES:-0}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - PASSWORD_RESET_TIMEOUT=${PASSWORD_RESET_TIMEOUT:-3600}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-}
      - REGISTRATION_CONFIRMATION_URL=${REGISTRATION_CONFIRMATION_URL:-}
      - TWO_FACTOR_ENABLED=${TWO_FACTOR_ENABLED:-1}
      - TWO_FACTOR_ISSUER=${TWO_FACTOR_ISSUER:-Statement AI}
      - TWO_FACTOR_ENCRYPTION_KEY=${TWO_FACTOR_ENCRYPTION_KEY:-}
      - TWO_FACTOR_CHALLENGE_TIMEOUT_SECONDS=${TWO_FACTOR_CHALLENGE_TIMEOUT_SECONDS:-300}
      - TWO_FACTOR_MAX_CHALLENGE_ATTEMPTS=${TWO_FACTOR_MAX_CHALLENGE_ATTEMPTS:-5}
      - TWO_FACTOR_RECOVERY_CODE_COUNT=${TWO_FACTOR_RECOVERY_CODE_COUNT:-10}
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-365}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - DB_ENGINE=${DB_ENGINE:-local}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-statement_ai_db}
      - POSTGRES_USER=${POSTGRES_USER:-statement_ai_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-statement_ai_password}
      - SUPABASE_DB_HOST=${SUPABASE_DB_HOST:-}
      - SUPABASE_DB_PORT=${SUPABASE_DB_PORT:-5432}
      - SUPABASE_DB_NAME=${SUPABASE_DB_NAME:-postgres}
      - SUPABASE_DB_USER=${SUPABASE_DB_USER:-}
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD:-}
      - SUPABASE_DB_SSLMODE=${SUPABASE_DB_SSLMODE:-require}
    depends_on:
      db:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-statement_ai_db}
      - POSTGRES_USER=${POSTGRES_USER:-statement_ai_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-statement_ai_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statement_ai_user} -d ${POSTGRES_DB:-statement_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  media_data:
  redis_data:
